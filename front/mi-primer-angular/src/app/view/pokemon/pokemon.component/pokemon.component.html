

<div class="container">
  <div class="row">
@for(p of pokemons; track p.name){

<div class="card" style="width: 18rem;">

  <div class="card-body">
    <h5 class="card-title">{{p.name}}</h5>
  </div>

  <img [src]="getPokemonImage(p.url)"   class="img-thumbnail" alt="p.name">
</div>
}
</div>
</div>
